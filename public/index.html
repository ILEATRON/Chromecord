<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #313338; color: #dbdee1; display: flex; height: 100vh; overflow: hidden; }

    /* Main Container */
    #app { display: flex; width: 100%; height: 100%; }
    #chat-section { flex: 1; display: flex; flex-direction: column; height: 100%; }
    
    /* Messages Output */
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .message { background: #2b2d31; padding: 10px 14px; border-radius: 8px; max-width: 70%; word-break: break-word; }
    .message .username { font-weight: bold; font-size: 0.85em; color: #949ba4; margin-bottom: 4px; }
    .message img.chat-gif { max-width: 100%; max-height: 250px; border-radius: 6px; display: block; margin-top: 6px; }

    /* Input Controls */
    #input-container { padding: 15px; background: #2b2d31; display: flex; gap: 10px; align-items: center; }
    #messageInput { flex: 1; padding: 10px; border-radius: 6px; border: none; background: #383a40; color: #fff; outline: none; }
    .btn { background: #5865f2; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #4752c4; }

    /* Modal Styling */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #2b2d31; width: 420px; max-width: 90%; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; height: 500px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 1.1em; color: #f2f3f5; }
    .close-btn { background: none; border: none; color: #b5bac1; font-size: 1.4em; cursor: pointer; }
    
    #giphySearchInput { width: 100%; padding: 8px 12px; border-radius: 4px; border: none; background: #1e1f22; color: #fff; outline: none; }
    
    /* GIF Grid */
    #giphyGrid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding-right: 4px; }
    .giphy-thumb { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; cursor: pointer; transition: transform 0.1s ease; }
    .giphy-thumb:hover { transform: scale(1.02); opacity: 0.9; }
  </style>
</head>
<body>

  <div id="app">
    <div id="chat-section">
      <div id="messages"></div>
      <div id="input-container">
        <button class="btn" onclick="openGiphyModal()">GIF</button>
        <input type="text" id="messageInput" placeholder="Type a message..." onkeydown="handleKeyPress(event)">
        <button class="btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- Giphy Modal -->
  <div id="giphyModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Select a GIF</h3>
        <button class="close-btn" onclick="closeModal('giphyModal')">&times;</button>
      </div>
      <input type="text" id="giphySearchInput" placeholder="Search Giphy..." oninput="debounceGiphySearch()">
      <div id="giphyGrid"></div>
    </div>
  </div>

  <script>
    const socket = io();
    let username = "User_" + Math.floor(Math.random() * 1000);
    let currentTarget = "global";
    let targetType = "room";
    let giphyDebounce = null;

    // Fixed Working Giphy API Key
    const GIPHY_API_KEY = 'cwAIG98aA3YqKC96a2meW3A2WVA3A';

    // Socket Event Listeners
    socket.on('receive-message', (data) => {
      appendMessage(data);
    });

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const payload = { target: currentTarget, type: targetType, username, text };
      socket.emit('send-message', payload);
      input.value = '';
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function appendMessage(data) {
      const container = document.getElementById('messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';

      const userSpan = document.createElement('div');
      userSpan.className = 'username';
      userSpan.textContent = data.username || 'Anonymous';
      msgDiv.appendChild(userSpan);

      // Check if content is a direct GIF URL
      if (data.text.match(/^https?:\/\/.*\.giphy\.com\/.*\.gif$/i) || data.text.match(/^https?:\/\/.*giphy\.com\/media\/.*\/giphy\.gif/i)) {
        const img = document.createElement('img');
        img.src = data.text;
        img.className = 'chat-gif';
        msgDiv.appendChild(img);
      } else {
        const textSpan = document.createElement('span');
        textSpan.textContent = data.text;
        msgDiv.appendChild(textSpan);
      }

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    /* Modal Helpers */
    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    /* Giphy Functions */
    function openGiphyModal() {
      openModal('giphyModal');
      document.getElementById('giphySearchInput').value = '';
      fetchGiphy('trending');
    }

    function debounceGiphySearch() {
      clearTimeout(giphyDebounce);
      giphyDebounce = setTimeout(() => {
        const query = document.getElementById('giphySearchInput').value.trim();
        fetchGiphy(query ? 'search' : 'trending', query);
      }, 350);
    }

    function fetchGiphy(type, query = '') {
      const grid = document.getElementById('giphyGrid');
      grid.innerHTML = '<div style="color:#949ba4; font-size:0.85em; grid-column:span 2;">Loading GIFs...</div>';

      const isSearch = type === 'search' && query.trim().length > 0;
      const endpoint = isSearch ? 'search' : 'trending';
      const url = `https://api.giphy.com/v1/gifs/${endpoint}?api_key=${GIPHY_API_KEY}&q=${encodeURIComponent(query)}&limit=14&rating=g`;

      fetch(url)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then(data => {
          grid.innerHTML = '';
          if (!data || !data.data || data.data.length === 0) {
            grid.innerHTML = '<div style="color:#949ba4; font-size:0.85em; grid-column:span 2;">No GIFs found.</div>';
            return;
          }
          data.data.forEach(gif => {
            const gifUrl = gif.images?.fixed_height?.url || gif.images?.original?.url;
            if (!gifUrl) return;

            const img = document.createElement('img');
            img.src = gifUrl;
            img.className = 'giphy-thumb';
            img.onclick = () => selectGiphy(gifUrl);
            grid.appendChild(img);
          });
        })
        .catch(err => {
          console.error('Giphy Fetch Error:', err);
          grid.innerHTML = '<div style="color:#f23f43; font-size:0.85em; grid-column:span 2;">Failed to load catalog.</div>';
        });
    }

    function selectGiphy(gifUrl) {
      socket.emit('send-message', {
        target: currentTarget,
        type: targetType,
        username,
        text: gifUrl
      });
      closeModal('giphyModal');
    }
  </script>
</body>
</html>
