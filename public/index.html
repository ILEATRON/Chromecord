<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #313338; color: #dbdee1; display: flex; height: 100vh; overflow: hidden; }

    #app { display: flex; width: 100%; height: 100%; }
    #chat-section { flex: 1; display: flex; flex-direction: column; height: 100%; }
    
    /* Top Bar with Voice Control */
    #top-bar { height: 50px; background: #2b2d31; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #1e1f22; }
    #voice-controls { display: flex; gap: 10px; align-items: center; }
    .status-indicator { font-size: 0.85em; color: #949ba4; }
    .status-indicator.connected { color: #23a55a; font-weight: bold; }

    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .message { background: #2b2d31; padding: 10px 14px; border-radius: 8px; max-width: 70%; word-break: break-word; }
    .message .username { font-weight: bold; font-size: 0.85em; color: #949ba4; margin-bottom: 4px; }
    .message img.chat-gif { max-width: 100%; max-height: 250px; border-radius: 6px; display: block; margin-top: 6px; }

    #input-container { padding: 15px; background: #2b2d31; display: flex; gap: 10px; align-items: center; }
    #messageInput { flex: 1; padding: 10px; border-radius: 6px; border: none; background: #383a40; color: #fff; outline: none; }
    
    .btn { background: #5865f2; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9em; }
    .btn:hover { background: #4752c4; }
    .btn-danger { background: #da373c; }
    .btn-danger:hover { background: #a1282c; }
    .btn-success { background: #23a55a; }
    .btn-success:hover { background: #1d8a4b; }

    /* Modal Styling */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #2b2d31; width: 420px; max-width: 90%; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; height: 500px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: none; border: none; color: #b5bac1; font-size: 1.4em; cursor: pointer; }
    #giphySearchInput { width: 100%; padding: 8px 12px; border-radius: 4px; border: none; background: #1e1f22; color: #fff; outline: none; }
    #giphyGrid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .giphy-thumb { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="app">
    <div id="chat-section">
      <div id="top-bar">
        <span>Global Room</span>
        <div id="voice-controls">
          <span id="call-status" class="status-indicator">Voice: Disconnected</span>
          <button id="joinCallBtn" class="btn btn-success" onclick="toggleVoiceCall()">Join Voice</button>
        </div>
      </div>

      <div id="messages"></div>

      <div id="input-container">
        <button class="btn" onclick="openGiphyModal()">GIF</button>
        <input type="text" id="messageInput" placeholder="Type a message..." onkeydown="handleKeyPress(event)">
        <button class="btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- Hidden Audio Element for Remote Voice Output -->
  <audio id="remoteAudio" autoplay></audio>

  <!-- Giphy Modal -->
  <div id="giphyModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Select a GIF</h3>
        <button class="close-btn" onclick="closeModal('giphyModal')">&times;</button>
      </div>
      <input type="text" id="giphySearchInput" placeholder="Search Giphy..." oninput="debounceGiphySearch()">
      <div id="giphyGrid"></div>
    </div>
  </div>

  <script>
    const socket = io();
    let username = "User_" + Math.floor(Math.random() * 1000);
    let currentTarget = "global";
    let targetType = "room";
    let giphyDebounce = null;
    const GIPHY_API_KEY = 'cwAIG98aA3YqKC96a2meW3A2WVA3A';

    /* --- WEBRTC VOICE CALL LOGIC --- */
    let localStream = null;
    let peerConnection = null;
    let isInCall = false;

    // Standard STUN servers provided by Google for NAT traversal
    const rtcConfig = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    async function toggleVoiceCall() {
      if (!isInCall) {
        await startVoiceCall();
      } else {
        endVoiceCall();
      }
    }

    async function startVoiceCall() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        setupPeerConnection();

        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        // Create and send WebRTC offer
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('webrtc-offer', { offer, room: currentTarget });

        isInCall = true;
        updateCallUI(true);
      } catch (err) {
        console.error("Microphone access error:", err);
        alert("Could not access microphone.");
      }
    }

    function setupPeerConnection() {
      peerConnection = new RTCPeerConnection(rtcConfig);

      // Handle incoming remote audio stream
      peerConnection.ontrack = (event) => {
        const remoteAudio = document.getElementById('remoteAudio');
        if (remoteAudio.srcObject !== event.streams[0]) {
          remoteAudio.srcObject = event.streams[0];
        }
      };

      // Send local ICE candidates to other peers via Socket.io
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('webrtc-candidate', { candidate: event.candidate, room: currentTarget });
        }
      };
    }

    function endVoiceCall() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      socket.emit('webrtc-leave', { room: currentTarget });
      isInCall = false;
      updateCallUI(false);
    }

    function updateCallUI(connected) {
      const btn = document.getElementById('joinCallBtn');
      const status = document.getElementById('call-status');
      if (connected) {
        btn.textContent = 'Leave Voice';
        btn.className = 'btn btn-danger';
        status.textContent = 'Voice: Connected';
        status.classList.add('connected');
      } else {
        btn.textContent = 'Join Voice';
        btn.className = 'btn btn-success';
        status.textContent = 'Voice: Disconnected';
        status.classList.remove('connected');
      }
    }

    /* WEBRTC SOCKET LISTENERS */
    socket.on('webrtc-offer', async (data) => {
      if (!isInCall) return; // Ignore if user hasn't pressed Join Voice
      if (!peerConnection) setupPeerConnection();

      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
      
      // Add local audio tracks if not added already
      if (localStream) {
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      }

      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      socket.emit('webrtc-answer', { answer, room: currentTarget });
    });

    socket.on('webrtc-answer', async (data) => {
      if (peerConnection) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      }
    });

    socket.on('webrtc-candidate', async (data) => {
      if (peerConnection && data.candidate) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch (e) {
          console.error('Error adding ICE candidate', e);
        }
      }
    });

    socket.on('webrtc-leave', () => {
      const remoteAudio = document.getElementById('remoteAudio');
      remoteAudio.srcObject = null;
    });

    /* --- STANDARD CHAT & GIPHY LOGIC --- */
    socket.on('receive-message', (data) => appendMessage(data));

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('send-message', { target: currentTarget, type: targetType, username, text });
      input.value = '';
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

    function appendMessage(data) {
      const container = document.getElementById('messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';
      
      const userSpan = document.createElement('div');
      userSpan.className = 'username';
      userSpan.textContent = data.username || 'Anonymous';
      msgDiv.appendChild(userSpan);

      if (data.text.match(/^https?:\/\/.*\.giphy\.com\/.*\.gif$/i) || data.text.match(/^https?:\/\/.*giphy\.com\/media\/.*\/giphy\.gif/i)) {
        const img = document.createElement('img');
        img.src = data.text;
        img.className = 'chat-gif';
        msgDiv.appendChild(img);
      } else {
        const textSpan = document.createElement('span');
        textSpan.textContent = data.text;
        msgDiv.appendChild(textSpan);
      }

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    /* Modal & Giphy Helpers */
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function openGiphyModal() {
      openModal('giphyModal');
      document.getElementById('giphySearchInput').value = '';
      fetchGiphy('trending');
    }

    function debounceGiphySearch() {
      clearTimeout(giphyDebounce);
      giphyDebounce = setTimeout(() => {
        const query = document.getElementById('giphySearchInput').value.trim();
        fetchGiphy(query ? 'search' : 'trending', query);
      }, 350);
    }

    function fetchGiphy(type, query = '') {
      const grid = document.getElementById('giphyGrid');
      grid.innerHTML = '<div style="color:#949ba4; font-size:0.85em; grid-column:span 2;">Loading GIFs...</div>';

      const isSearch = type === 'search' && query.trim().length > 0;
      const endpoint = isSearch ? 'search' : 'trending';
      const url = `https://api.giphy.com/v1/gifs/${endpoint}?api_key=${GIPHY_API_KEY}&q=${encodeURIComponent(query)}&limit=14&rating=g`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          grid.innerHTML = '';
          if (!data?.data?.length) {
            grid.innerHTML = '<div style="color:#949ba4; font-size:0.85em; grid-column:span 2;">No GIFs found.</div>';
            return;
          }
          data.data.forEach(gif => {
            const gifUrl = gif.images?.fixed_height?.url || gif.images?.original?.url;
            if (!gifUrl) return;
            const img = document.createElement('img');
            img.src = gifUrl;
            img.className = 'giphy-thumb';
            img.onclick = () => selectGiphy(gifUrl);
            grid.appendChild(img);
          });
        })
        .catch(() => {
          grid.innerHTML = '<div style="color:#f23f43; font-size:0.85em; grid-column:span 2;">Failed to load catalog.</div>';
        });
    }

    function selectGiphy(gifUrl) {
      socket.emit('send-message', { target: currentTarget, type: targetType, username, text: gifUrl });
      closeModal('giphyModal');
    }
  </script>
</body>
</html>
