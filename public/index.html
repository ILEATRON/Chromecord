<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chromebook Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; height: 100vh; background: #313338; color: #dbdee1; overflow: hidden; }
    
    #sidebar { width: 260px; background: #2b2d31; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #1e1f22; }
    .channel { padding: 8px 12px; background: #35373c; border-radius: 4px; color: #ffffff; font-weight: 500; }
    
    .admin-panel { background: #1e1f22; padding: 10px; border-radius: 6px; margin-top: 15px; display: none; flex-direction: column; gap: 8px; }
    .admin-panel h4 { font-size: 0.75em; color: #f23f43; text-transform: uppercase; }
    
    #requestList { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
    .request-item { background: #2b2d31; padding: 8px; border-radius: 4px; font-size: 0.8em; display: flex; flex-direction: column; gap: 6px; border: 1px solid #35373c; }
    .req-btns { display: flex; gap: 6px; }
    .approve-btn { background: #23a55a; color: white; border: none; padding: 4px 8px; border-radius: 3px; font-size: 0.75em; cursor: pointer; font-weight: bold; flex: 1; }
    .approve-btn:hover { background: #1f924e; }
    .reject-btn { background: #f23f43; color: white; border: none; padding: 4px 8px; border-radius: 3px; font-size: 0.75em; cursor: pointer; font-weight: bold; flex: 1; }
    .reject-btn:hover { background: #d83a3e; }

    .user-profile { background: #232428; padding: 10px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px; }
    .user-profile .label { font-size: 0.7em; color: #949ba4; text-transform: uppercase; font-weight: bold; }
    .user-profile .name-display { font-size: 0.9em; color: #ffffff; font-weight: bold; }
    .change-btn { background: #383a40; color: #dbdee1; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75em; cursor: pointer; }
    .change-btn:hover { background: #404249; color: #fff; }

    #main { flex: 1; display: flex; flex-direction: column; background: #313338; height: 100vh; }
    #chat-header { height: 48px; padding: 0 20px; display: flex; align-items: center; background: #313338; border-bottom: 1px solid #1e1f22; font-weight: bold; }
    
    #messages { flex: 1; padding: 20px; overflow-y: scroll; display: flex; flex-direction: column; gap: 12px; }
    
    .msg { background: #2b2d31; padding: 10px 14px; border-radius: 8px; width: fit-content; max-width: 70%; word-break: break-word; }
    .msg .author { font-weight: bold; font-size: 0.85em; color: #5865f2; margin-bottom: 4px; }
    .msg .time { font-size: 0.7em; color: #949ba4; font-weight: normal; margin-left: 8px; }
    .msg .text { font-size: 0.95em; color: #dbdee1; line-height: 1.4; }
    .msg img { max-width: 100%; max-height: 300px; border-radius: 6px; margin-top: 8px; display: block; }
    
    #typingContainer { height: 20px; padding: 0 20px; font-size: 0.78em; color: #b5bac1; font-weight: 600; display: flex; align-items: center; }

    #input-area { padding: 10px 20px 20px; background: #313338; display: flex; gap: 10px; align-items: center; }
    #msgInput { flex: 1; padding: 12px 16px; background: #383a40; border: none; color: white; border-radius: 8px; font-size: 0.95em; outline: none; }
    
    .media-btn { background: #383a40; color: #b5bac1; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; border: none; font-size: 0.9em; }
    .media-btn:hover { background: #404249; color: white; }
    #fileInput { display: none; }
    
    button.send-btn { padding: 12px 20px; background: #5865f2; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button.send-btn:hover { background: #4752c4; }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-box { background: #313338; padding: 24px; border-radius: 8px; width: 380px; display: flex; flex-direction: column; gap: 10px; }
    .modal-box h3 { color: white; }
    .modal-box input { padding: 10px; background: #1e1f22; border: 1px solid #3f4147; color: white; border-radius: 4px; outline: none; }
    .error-txt { color: #f23f43; font-size: 0.8em; }

    .switch-user-link { font-size: 0.75em; color: #5865f2; cursor: pointer; text-decoration: underline; margin-top: 4px; }

    /* GIF Modal Styles */
    .tab-bar { display: flex; gap: 8px; border-bottom: 1px solid #3f4147; padding-bottom: 8px; }
    .tab-btn { background: transparent; color: #949ba4; border: none; padding: 4px 8px; cursor: pointer; font-weight: bold; font-size: 0.85em; }
    .tab-btn.active { color: white; border-bottom: 2px solid #5865f2; }
    #gifGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 260px; overflow-y: auto; margin-top: 5px; }
    #gifGrid img { width: 100%; height: 110px; object-fit: cover; border-radius: 4px; cursor: pointer; transition: transform 0.1s; }
    #gifGrid img:hover { transform: scale(1.03); }
  </style>
</head>
<body>

  <!-- Passcode Access Modal -->
  <div id="authModal" class="modal-overlay">
    <div class="modal-box" style="width: 320px;">
      <h3 id="authTitle">Enter Chat</h3>
      <p id="authSubtitle" style="font-size: 0.8em; color: #949ba4;">Enter a username and passcode.</p>
      
      <input type="text" id="authName" placeholder="Username" onkeydown="if(event.key==='Enter') enterChat()">
      <input type="password" id="authCode" placeholder="Access Passcode" onkeydown="if(event.key==='Enter') enterChat()">
      
      <div id="authError" class="error-txt"></div>
      <button class="send-btn" onclick="enterChat()">Join</button>
      <span id="switchUserBtn" class="switch-user-link" style="display: none;" onclick="resetSavedUser()">Not you? Switch user</span>
    </div>
  </div>

  <!-- Change Display Name Modal -->
  <div id="changeModal" class="modal-overlay" style="display: none;">
    <div class="modal-box" style="width: 320px;">
      <h3>Change Display Name</h3>
      <p style="font-size: 0.75em; color: #949ba4;">Changes require admin approval before updating.</p>
      <input type="text" id="newNameInput" placeholder="New Username">
      <div id="nameStatus" style="font-size: 0.8em; color: #23a55a;"></div>
      <button class="send-btn" onclick="submitNameChange()">Request Change</button>
      <button class="change-btn" onclick="closeChangeModal()">Cancel</button>
    </div>
  </div>

  <!-- GIF Modal -->
  <div id="gifModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h3>Add GIF</h3>
      <div class="tab-bar">
        <button class="tab-btn active" id="tabSearchBtn" onclick="switchGifTab('search')">Search GIFs</button>
        <button class="tab-btn" id="tabUrlBtn" onclick="switchGifTab('url')">Web Link</button>
      </div>

      <div id="searchTabSection">
        <input type="text" id="gifSearchInput" placeholder="Search GIFs..." onkeyup="if(event.key==='Enter') searchGifs()">
        <div id="gifGrid"></div>
      </div>

      <div id="urlTabSection" style="display: none;">
        <p style="font-size: 0.8em; color: #949ba4; margin-bottom: 6px;">Paste direct GIF link:</p>
        <input type="text" id="gifUrlInput" placeholder="https://example.com/image.gif">
        <button class="send-btn" style="margin-top: 10px; width: 100%;" onclick="sendCustomGifUrl()">Send GIF Link</button>
      </div>

      <button class="change-btn" onclick="closeGifModal()" style="margin-top: 5px;">Close</button>
    </div>
  </div>

  <div id="sidebar">
    <div>
      <h3 style="color: #949ba4; font-size: 0.8em; text-transform: uppercase; margin-bottom: 8px;">Channels</h3>
      <div class="channel"># general</div>

      <!-- Admin Panel Section -->
      <div id="adminPanel" class="admin-panel">
        <h4>Pending Name Changes</h4>
        <div id="requestList"></div>
      </div>
    </div>
    
    <div class="user-profile">
      <span class="label">Chatting as</span>
      <span class="name-display" id="profileName">...</span>
      <button class="change-btn" onclick="openChangeModal()">Change Name</button>
    </div>
  </div>

  <div id="main">
    <div id="chat-header"># general</div>
    <div id="messages"></div>
    
    <div id="typingContainer"></div>

    <div id="input-area">
      <label class="media-btn" title="Upload Image or GIF from Computer">
        📷
        <input type="file" id="fileInput" accept="image/*,image/gif" onchange="handleImageSelect()">
      </label>
      
      <button class="media-btn" onclick="openGifModal()" title="Search GIFs">GIF</button>
      
      <input type="text" id="msgInput" placeholder="Message #general" oninput="handleTyping()" onkeydown="if(event.key==='Enter') send()">
      <button class="send-btn" onclick="send()">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentChannel = 'general';
    let selectedImageBase64 = null;
    let username = '';
    let isAdmin = false;

    let typingTimeout = null;
    let currentlyTypingUsers = new Set();

    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('chatUsername');
      if (savedUser) {
        document.getElementById('authName').value = savedUser;
        document.getElementById('authName').style.display = 'none';
        document.getElementById('authTitle').innerText = `Welcome Back, ${savedUser}!`;
        document.getElementById('authSubtitle').innerText = 'Enter passcode to join.';
        document.getElementById('switchUserBtn').style.display = 'inline-block';
        document.getElementById('authCode').focus();
      }
    });

    function resetSavedUser() {
      localStorage.removeItem('chatUsername');
      document.getElementById('authName').value = '';
      document.getElementById('authName').style.display = 'block';
      document.getElementById('authTitle').innerText = 'Enter Chat';
      document.getElementById('authSubtitle').innerText = 'Enter a username and passcode.';
      document.getElementById('switchUserBtn').style.display = 'none';
      document.getElementById('authName').focus();
    }

    function enterChat() {
      const u = document.getElementById('authName').value.trim();
      const code = document.getElementById('authCode').value;
      const err = document.getElementById('authError');
      err.innerText = '';

      if (!u || !code) {
        err.innerText = "Please fill in all fields.";
        return;
      }

      socket.emit('verify-code', { username: u, code }, (res) => {
        if (res.success) {
          username = res.username;
          isAdmin = res.isAdmin;

          localStorage.setItem('chatUsername', username);

          document.getElementById('profileName').innerText = username + (isAdmin ? ' (Admin)' : '');
          document.getElementById('authModal').style.display = 'none';
          
          if (isAdmin) {
            document.getElementById('adminPanel').style.display = 'flex';
          }
          
          socket.emit('join-channel', currentChannel);
        } else {
          err.innerText = res.error;
        }
      });
    }

    /* Typing logic */
    function handleTyping() {
      socket.emit('typing', { channel: currentChannel, isTyping: true });
      
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        socket.emit('typing', { channel: currentChannel, isTyping: false });
      }, 2000);
    }

    socket.on('user-typing', ({ username: user, isTyping }) => {
      if (isTyping) {
        currentlyTypingUsers.add(user);
      } else {
        currentlyTypingUsers.delete(user);
      }
      updateTypingIndicator();
    });

    function updateTypingIndicator() {
      const container = document.getElementById('typingContainer');
      const users = Array.from(currentlyTypingUsers);

      if (users.length === 0) {
        container.innerText = '';
      } else if (users.length === 1) {
        container.innerText = `${users[0]} is typing...`;
      } else if (users.length === 2) {
        container.innerText = `${users[0]} and ${users[1]} are typing...`;
      } else {
        container.innerText = `Several people are typing...`;
      }
    }

    function openChangeModal() {
      document.getElementById('nameStatus').innerText = '';
      document.getElementById('changeModal').style.display = 'flex';
    }

    function closeChangeModal() {
      document.getElementById('changeModal').style.display = 'none';
    }

    function submitNameChange() {
      const newName = document.getElementById('newNameInput').value.trim();
      if (newName) {
        socket.emit('request-name-change', newName);
        document.getElementById('nameStatus').innerText = 'Request submitted! Awaiting admin approval...';
      }
    }

    /* Socket events */
    socket.on('name-change-approved', (approvedName) => {
      username = approvedName;
      localStorage.setItem('chatUsername', username);
      document.getElementById('profileName').innerText = username + (isAdmin ? ' (Admin)' : '');
      alert('Your username change was approved!');
      closeChangeModal();
    });

    socket.on('name-change-rejected', (msg) => {
      alert(msg);
      closeChangeModal();
    });

    socket.on('admin-pending-list', (list) => {
      if (isAdmin) renderAdminRequests(list);
    });

    function renderAdminRequests(requests) {
      const listDiv = document.getElementById('requestList');
      listDiv.innerHTML = '';

      if (!requests || requests.length === 0) {
        listDiv.innerHTML = '<span style="font-size:0.75em; color:#949ba4;">No pending requests</span>';
        return;
      }

      requests.forEach(req => {
        const item = document.createElement('div');
        item.className = 'request-item';
        item.innerHTML = `
          <div><b>${escapeHtml(req.oldName)}</b> &rarr; <span style="color:#23a55a; font-weight:bold;">${escapeHtml(req.newName)}</span></div>
          <div class="req-btns">
            <button class="approve-btn" onclick="decideRequest('${req.requestId}', true)">Approve</button>
            <button class="reject-btn" onclick="decideRequest('${req.requestId}', false)">Reject</button>
          </div>
        `;
        listDiv.appendChild(item);
      });
    }

    function decideRequest(requestId, approved) {
      socket.emit('admin-decide-name', { requestId, approved });
    }

    /* GIF Modal & Tenor Search API */
    function openGifModal() {
      document.getElementById('gifModal').style.display = 'flex';
      switchGifTab('search');
      searchGifs();
    }

    function closeGifModal() {
      document.getElementById('gifModal').style.display = 'none';
    }

    function switchGifTab(tab) {
      const isSearch = tab === 'search';
      document.getElementById('searchTabSection').style.display = isSearch ? 'block' : 'none';
      document.getElementById('urlTabSection').style.display = isSearch ? 'none' : 'block';
      document.getElementById('tabSearchBtn').className = `tab-btn ${isSearch ? 'active' : ''}`;
      document.getElementById('tabUrlBtn').className = `tab-btn ${!isSearch ? 'active' : ''}`;
    }

    async function searchGifs() {
      const query = document.getElementById('gifSearchInput').value.trim();
      const grid = document.getElementById('gifGrid');
      grid.innerHTML = '<p style="color:#949ba4; font-size:0.8em;">Loading GIFs...</p>';

      const searchTerm = query || 'trending';
      const apiKey = 'LIVDSRZULE21'; 
      const url = `https://g.tenor.com/v1/search?q=${encodeURIComponent(searchTerm)}&key=${apiKey}&limit=12`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.results && data.results.length > 0) {
          const gifUrls = data.results.map(item => item.media[0].gif.url);
          renderGifResults(gifUrls);
          return;
        } else {
          grid.innerHTML = '<p style="color:#949ba4; font-size:0.8em;">No GIFs found.</p>';
        }
      } catch (e) {
        console.error("GIF Fetch Error:", e);
        grid.innerHTML = '<p style="color:#f23f43; font-size:0.8em;">Failed to load GIFs. Use Web Link tab.</p>';
      }
    }

    function renderGifResults(urls) {
      const grid = document.getElementById('gifGrid');
      grid.innerHTML = '';
      urls.forEach(url => {
        if (url) {
          const img = document.createElement('img');
          img.src = url;
          img.onclick = () => selectGif(url);
          grid.appendChild(img);
        }
      });
    }

    function sendCustomGifUrl() {
      const url = document.getElementById('gifUrlInput').value.trim();
      if (!url) return;
      selectGif(url);
      document.getElementById('gifUrlInput').value = '';
    }

    function selectGif(url) {
      socket.emit('send-message', { channel: currentChannel, username, text: '', image: url });
      closeGifModal();
    }

    function handleImageSelect() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        selectedImageBase64 = e.target.result;
        send();
      };
      reader.readAsDataURL(file);
    }

    socket.on('channel-history', (history) => {
      const container = document.getElementById('messages');
      container.innerHTML = '';
      history.forEach(appendMessage);
      scrollToBottom();
    });

    socket.on('receive-message', (msg) => {
      appendMessage(msg);
      scrollToBottom();
    });

    function appendMessage(msg) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg';
      
      let content = `<div class="author">${escapeHtml(msg.username)} <span class="time">${msg.timestamp}</span></div>`;
      if (msg.text) content += `<div class="text">${escapeHtml(msg.text)}</div>`;
      if (msg.image) content += `<img src="${msg.image}" alt="attachment" onload="scrollToBottom()" />`;
      
      div.innerHTML = content;
      container.appendChild(div);
    }

    function scrollToBottom() {
      const container = document.getElementById('messages');
      container.scrollTop = container.scrollHeight;
    }

    function send() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      
      if (!text && !selectedImageBase64) return;

      clearTimeout(typingTimeout);
      socket.emit('typing', { channel: currentChannel, isTyping: false });

      socket.emit('send-message', { channel: currentChannel, username, text, image: selectedImageBase64 });

      input.value = '';
      selectedImageBase64 = null;
      document.getElementById('fileInput').value = '';
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
