<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chromebook Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; height: 100vh; background: #313338; color: #dbdee1; overflow: hidden; }
    
    /* Sidebar */
    #sidebar { width: 240px; background: #2b2d31; padding: 15px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #1e1f22; justify-content: space-between; }
    .sidebar-top h3 { color: #949ba4; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .channel { padding: 8px 12px; background: #35373c; border-radius: 4px; cursor: pointer; color: #ffffff; font-weight: 500; }
    
    /* User Profile Bar at bottom of sidebar */
    .user-profile { background: #232428; padding: 10px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px; }
    .user-profile label { font-size: 0.75em; color: #949ba4; text-transform: uppercase; font-weight: bold; }
    .user-profile input { padding: 6px 8px; background: #1e1f22; border: 1px solid #3f4147; color: #fff; border-radius: 4px; font-size: 0.85em; outline: none; }
    .user-profile input:focus { border-color: #5865f2; }

    /* Main Chat Area */
    #main { flex: 1; display: flex; flex-direction: column; background: #313338; }
    #chat-header { height: 48px; padding: 0 20px; display: flex; align-items: center; background: #313338; border-bottom: 1px solid #1e1f22; font-weight: bold; }
    #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    
    /* Message Bubble */
    .msg { background: #2b2d31; padding: 10px 14px; border-radius: 8px; width: fit-content; max-width: 80%; word-break: break-word; }
    .msg .author { font-weight: bold; font-size: 0.85em; color: #5865f2; margin-bottom: 4px; }
    .msg .time { font-size: 0.7em; color: #949ba4; font-weight: normal; margin-left: 8px; }
    .msg .text { font-size: 0.95em; color: #dbdee1; line-height: 1.4; }
    
    /* Input Area */
    #input-area { padding: 15px 20px; background: #313338; display: flex; gap: 10px; }
    #msgInput { flex: 1; padding: 12px 16px; background: #383a40; border: none; color: white; border-radius: 8px; font-size: 0.95em; outline: none; }
    #msgInput::placeholder { color: #80848e; }
    button { padding: 12px 20px; background: #5865f2; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #4752c4; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="sidebar-top">
      <h3>Text Channels</h3>
      <div class="channel"># general</div>
    </div>
    
    <!-- Username Profile Controls -->
    <div class="user-profile">
      <label for="usernameInput">Display Name</label>
      <input type="text" id="usernameInput" placeholder="Enter username..." onchange="saveUsername()">
    </div>
  </div>

  <div id="main">
    <div id="chat-header"># general</div>
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="msgInput" placeholder="Message #general" onkeypress="if(event.key==='Enter') send()">
      <button onclick="send()">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentChannel = 'general';

    // Load saved username or create a default random one
    let savedName = localStorage.getItem('chat_username');
    if (!savedName) {
      savedName = "User_" + Math.floor(1000 + Math.random() * 9000);
      localStorage.setItem('chat_username', savedName);
    }
    
    const nameInput = document.getElementById('usernameInput');
    nameInput.value = savedName;

    function saveUsername() {
      let newName = nameInput.value.trim();
      if (!newName) {
        newName = "User_" + Math.floor(1000 + Math.random() * 9000);
        nameInput.value = newName;
      }
      localStorage.setItem('chat_username', newName);
    }

    socket.emit('join-channel', currentChannel);

    socket.on('channel-history', (history) => {
      const container = document.getElementById('messages');
      container.innerHTML = '';
      history.forEach(appendMessage);
    });

    socket.on('receive-message', (msg) => {
      appendMessage(msg);
    });

    function appendMessage(msg) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `
        <div class="author">${escapeHtml(msg.username)} <span class="time">${msg.timestamp}</span></div>
        <div class="text">${escapeHtml(msg.text)}</div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function send() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      const activeUsername = localStorage.getItem('chat_username') || "Anonymous";
      
      if (!text) return;

      socket.emit('send-message', { channel: currentChannel, username: activeUsername, text });
      input.value = '';
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
