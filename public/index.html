<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chromebook Chat & Polls</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="chat-header">
      <h2>#general</h2>
      <button id="open-poll-modal-btn" class="btn-secondary">+ New Poll</button>
    </header>

    <!-- Message Stream -->
    <main id="chat-messages" class="chat-messages"></main>

    <!-- Input Footer -->
    <footer class="chat-footer">
      <form id="chat-form">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
        <button type="submit" class="btn-primary">Send</button>
      </form>
    </footer>
  </div>

  <!-- Create Poll Modal -->
  <div id="poll-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Create a Poll</h3>
      <form id="poll-form">
        <label>Question</label>
        <input type="text" id="poll-question" placeholder="e.g., What should we play tonight?" required>

        <label>Options</label>
        <div id="poll-options-container">
          <input type="text" class="poll-opt-input" placeholder="Option 1" required>
          <input type="text" class="poll-opt-input" placeholder="Option 2" required>
        </div>

        <button type="button" id="add-option-btn" class="btn-secondary">+ Add Option</button>
        
        <div class="modal-actions">
          <button type="button" id="close-modal-btn" class="btn-cancel">Cancel</button>
          <button type="submit" class="btn-primary">Create Poll</button>
        </div>
      </form>
    </div>
  </div>

  <script src="client.js"></script>
</body>
</html>
