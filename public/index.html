<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chromebook Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; height: 100vh; background: #313338; color: #dbdee1; overflow: hidden; }
    
    #sidebar { width: 260px; background: #2b2d31; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #1e1f22; }
    
    .sidebar-section-title { color: #949ba4; font-size: 0.75em; font-weight: bold; text-transform: uppercase; margin: 12px 0 6px; display: flex; justify-content: space-between; align-items: center; }
    
    .channel-list { display: flex; flex-direction: column; gap: 4px; max-height: 160px; overflow-y: auto; }
    .channel, .friend-item { padding: 8px 12px; background: #35373c; border-radius: 4px; color: #ffffff; font-weight: 500; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: space-between; }
    .channel.active, .friend-item.active { background: #404249; }
    .channel:hover, .friend-item:hover { background: #383a40; }

    .delete-ch-btn { color: #f23f43; font-size: 0.85em; opacity: 0.7; padding: 2px 4px; border-radius: 3px; cursor: pointer; }
    .delete-ch-btn:hover { opacity: 1; background: rgba(242, 63, 67, 0.2); }

    .friends-list { display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow-y: auto; }
    .friend-item { font-size: 0.85em; }
    .friend-info { display: flex; align-items: center; gap: 8px; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: #1e1f22; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #80848e; display: inline-block; }
    .status-dot.online { background-color: #23a55a; }

    .add-btn { background: none; border: none; color: #2ecc71; font-size: 1.2em; cursor: pointer; line-height: 1; padding: 0 4px; }
    .add-btn:hover { color: #27ae60; }

    .requests-container { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; max-height: 120px; overflow-y: auto; }
    .request-card { background: #1e1f22; padding: 8px 10px; border-radius: 6px; font-size: 0.8em; display: flex; align-items: center; justify-content: space-between; border: 1px solid #3f4147; }
    .req-actions { display: flex; gap: 4px; }
    .accept-btn { background: #23a55a; color: white; border: none; padding: 4px 8px; border-radius: 3px; font-weight: bold; cursor: pointer; }
    .decline-btn { background: #f23f43; color: white; border: none; padding: 4px 8px; border-radius: 3px; font-weight: bold; cursor: pointer; }
    
    .user-profile { background: #232428; padding: 12px; border-radius: 6px; display: flex; flex-direction: column; gap: 8px; }
    .profile-header { display: flex; align-items: center; gap: 10px; }
    .profile-avatar { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 2px solid #5865f2; object-fit: cover; }
    .user-profile .name-display { font-size: 0.9em; color: #ffffff; font-weight: bold; }
    .admin-tag { font-size: 0.65em; background: #ed4245; color: white; padding: 2px 4px; border-radius: 3px; margin-left: 4px; vertical-align: middle; }

    .melon-btn-wrapper { position: relative; width: 100%; margin-bottom: 2px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .melon-btn-title { font-size: 0.75em; font-weight: 800; color: #2ecc71; text-transform: uppercase; letter-spacing: 0.5px; }
    .melon-btn { background: linear-gradient(135deg, #2ecc71 0%, #27ae60 70%, #c0392b 70%, #e74c3c 100%); border: 2px solid #2ecc71; border-radius: 8px; width: 100%; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 1.4em; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.4); text-decoration: none; }

    #main { flex: 1; display: flex; flex-direction: column; background: #313338; height: 100vh; position: relative; }
    #chat-header { height: 52px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; background: #313338; border-bottom: 1px solid #1e1f22; font-weight: bold; }

    .admin-clear-btn { background: #f23f43; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 0.8em; font-weight: bold; cursor: pointer; display: none; }
    .admin-clear-btn:hover { background: #da373c; }

    #messages { flex: 1; padding: 20px; overflow-y: scroll; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
    
    .msg { background: #2b2d31; padding: 10px 14px; border-radius: 8px; width: fit-content; max-width: 70%; word-break: break-word; display: flex; gap: 12px; position: relative; }
    .msg:hover .reaction-picker-trigger { display: flex; }

    .msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .msg-content { display: flex; flex-direction: column; width: 100%; }
    .msg .author { font-weight: bold; font-size: 0.85em; color: #5865f2; margin-bottom: 2px; }
    .msg .time { font-size: 0.7em; color: #949ba4; font-weight: normal; margin-left: 8px; }
    .msg .text { font-size: 0.95em; color: #dbdee1; line-height: 1.4; }
    
    .reactions-bar { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .reaction-badge { background: #2b2d31; border: 1px solid #3f4147; border-radius: 12px; padding: 2px 6px; font-size: 0.75em; display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
    .reaction-badge.active { background: #3c4270; border-color: #5865f2; color: #ffffff; }
    .reaction-badge:hover { background: #35373c; }

    .reaction-picker-trigger { display: none; position: absolute; right: 8px; top: -12px; background: #2b2d31; border: 1px solid #3f4147; border-radius: 16px; padding: 2px 6px; gap: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
    .emoji-opt { cursor: pointer; font-size: 0.85em; transition: transform 0.1s; }
    .emoji-opt:hover { transform: scale(1.2); }

    #typingContainer { height: 20px; padding: 0 20px; font-size: 0.78em; color: #b5bac1; font-weight: 600; display: flex; align-items: center; }

    #input-area { padding: 10px 20px 20px; background: #313338; display: flex; gap: 10px; align-items: center; }
    #msgInput { flex: 1; padding: 12px 16px; background: #383a40; border: none; color: white; border-radius: 8px; font-size: 0.95em; outline: none; }
    button.send-btn { padding: 12px 20px; background: #5865f2; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button.send-btn:hover { background: #4752c4; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-box { background: #313338; padding: 24px; border-radius: 8px; width: 340px; display: flex; flex-direction: column; gap: 12px; }
    .modal-box h3 { color: white; }
    .modal-box input { padding: 10px; background: #1e1f22; border: 1px solid #3f4147; color: white; border-radius: 4px; outline: none; }
    .status-msg { font-size: 0.8em; }
    .cancel-btn { background: #383a40; color: #dbdee1; border: none; padding: 8px; border-radius: 4px; font-size: 0.85em; cursor: pointer; }
    .cancel-btn:hover { background: #404249; color: #fff; }
  </style>
</head>
<body>

  <!-- Access Modal -->
  <div id="authModal" class="modal-overlay">
    <div class="modal-box">
      <h3>Enter Chat</h3>
      <p style="font-size: 0.8em; color: #949ba4;">Enter your username and access passcode.</p>
      <input type="text" id="authName" placeholder="Username" onkeydown="if(event.key==='Enter') enterChat()">
      <input type="password" id="authCode" placeholder="Access Passcode" onkeydown="if(event.key==='Enter') enterChat()">
      <div id="authError" class="status-msg" style="color:#f23f43;"></div>
      <button class="send-btn" onclick="enterChat()">Join</button>
    </div>
  </div>

  <!-- Add Friend Modal -->
  <div id="friendModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h3>Send Friend Request</h3>
      <input type="text" id="friendNameInput" placeholder="Friend's Username" onkeydown="if(event.key==='Enter') sendFriendRequest()">
      <div id="friendStatus" class="status-msg"></div>
      <button class="send-btn" onclick="sendFriendRequest()">Send Request</button>
      <button class="cancel-btn" onclick="closeModal('friendModal')">Cancel</button>
    </div>
  </div>

  <!-- Add Channel Modal -->
  <div id="channelModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h3>Create Channel</h3>
      <input type="text" id="channelNameInput" placeholder="Channel Name (e.g. gaming)" onkeydown="if(event.key==='Enter') createChannel()">
      <div id="channelStatus" class="status-msg"></div>
      <button class="send-btn" onclick="createChannel()">Create</button>
      <button class="cancel-btn" onclick="closeModal('channelModal')">Cancel</button>
    </div>
  </div>

  <!-- Change Avatar Modal -->
  <div id="avatarModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h3>Change Profile Picture</h3>
      <p style="font-size:0.8em; color:#949ba4;">Paste an image URL for your avatar:</p>
      <input type="text" id="avatarUrlInput" placeholder="https://example.com/photo.png">
      <div id="avatarStatus" class="status-msg"></div>
      <button class="send-btn" onclick="updateAvatar()">Save Avatar</button>
      <button class="cancel-btn" onclick="closeModal('avatarModal')">Cancel</button>
    </div>
  </div>

  <div id="sidebar">
    <div>
      <div class="sidebar-section-title">
        <span>Channels</span>
        <button class="add-btn" onclick="openModal('channelModal')" title="Create Channel">+</button>
      </div>
      <div id="channelList" class="channel-list"></div>

      <div id="requestsHeader" class="sidebar-section-title" style="display: none;">Pending Requests</div>
      <div id="requestsList" class="requests-container"></div>

      <div class="sidebar-section-title">
        <span>Direct Messages</span>
        <button class="add-btn" onclick="openModal('friendModal')" title="Add Friend">+</button>
      </div>
      <div id="friendsList" class="friends-list"></div>
    </div>
    
    <div class="user-profile">
      <div class="melon-btn-wrapper">
        <span class="melon-btn-title">fps melons</span>
        <a href="https://fps-melons.onrender.com/" target="_blank" class="melon-btn">🍉</a>
      </div>

      <div class="profile-header">
        <img id="myAvatar" class="profile-avatar" src="" onclick="openModal('avatarModal')" title="Click to change profile picture">
        <span class="name-display" id="profileName">...</span>
      </div>
    </div>
  </div>

  <div id="main">
    <div id="chat-header">
      <span id="chatTitle"># general</span>
      <button id="clearHistoryBtn" class="admin-clear-btn" onclick="clearRoomHistory()">Clear History</button>
    </div>

    <div id="messages"></div>
    <div id="typingContainer"></div>

    <div id="input-area">
      <input type="text" id="msgInput" placeholder="Message..." onkeydown="if(event.key==='Enter') send()" oninput="handleTyping()">
      <button class="send-btn" onclick="send()">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let username = '';
    let currentAvatar = '';
    let currentTarget = 'general';
    let targetType = 'channel';
    let isAdmin = false;
    
    let channels = [];
    let friends = [];
    let pendingRequests = [];
    let onlineUsers = new Map();
    let typingTimeout = null;

    const AVAILABLE_EMOJIS = ['👍', '❤️', '🔥', '😂', '😮'];

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function enterChat() {
      const u = document.getElementById('authName').value.trim();
      const code = document.getElementById('authCode').value;
      const err = document.getElementById('authError');

      if (!u || !code) {
        err.innerText = 'Both fields are required.';
        return;
      }

      socket.emit('verify-code', { username: u, code }, (res) => {
        if (res.success) {
          username = res.username;
          currentAvatar = res.avatarUrl;
          isAdmin = res.isAdmin;
          
          document.getElementById('profileName').innerHTML = escapeHtml(username) + (isAdmin ? ' <span class="admin-tag">ADMIN</span>' : '');
          document.getElementById('myAvatar').src = currentAvatar;
          document.getElementById('authModal').style.display = 'none';

          if (isAdmin) {
            document.getElementById('clearHistoryBtn').style.display = 'block';
          }
          
          socket.emit('user-connected', username);
          switchTarget('general', 'channel');
        } else {
          err.innerText = res.error;
        }
      });
    }

    function createChannel() {
      const channelName = document.getElementById('channelNameInput').value;
      const status = document.getElementById('channelStatus');

      socket.emit('create-channel', { channelName }, (res) => {
        if (res.success) {
          closeModal('channelModal');
          switchTarget(res.channelName, 'channel');
        } else {
          status.style.color = '#f23f43';
          status.innerText = res.error;
        }
      });
    }

    function deleteChannel(channelName, e) {
      e.stopPropagation();
      if (!confirm(`Are you sure you want to delete #${channelName}?`)) return;

      socket.emit('delete-channel', { channelName }, (res) => {
        if (!res.success) {
          alert(res.error);
        }
      });
    }

    function clearRoomHistory() {
      if (!confirm(`Are you sure you want to delete all message history in ${currentTarget}?`)) return;

      socket.emit('clear-room-messages', { target: currentTarget, type: targetType }, (res) => {
        if (!res.success) alert(res.error);
      });
    }

    function updateAvatar() {
      const avatarUrl = document.getElementById('avatarUrlInput').value.trim();
      if (!avatarUrl) return;

      socket.emit('update-avatar', { avatarUrl }, (res) => {
        if (res.success) {
          currentAvatar = res.avatarUrl;
          document.getElementById('myAvatar').src = currentAvatar;
          closeModal('avatarModal');
        }
      });
    }

    function sendFriendRequest() {
      const targetUsername = document.getElementById('friendNameInput').value.trim();
      const status = document.getElementById('friendStatus');

      socket.emit('send-friend-request', { targetUsername }, (res) => {
        if (res.success) {
          status.style.color = '#23a55a';
          status.innerText = res.message;
          setTimeout(() => closeModal('friendModal'), 1200);
        } else {
          status.style.color = '#f23f43';
          status.innerText = res.error;
        }
      });
    }

    function respondRequest(senderUsername, accept) {
      socket.emit('respond-friend-request', { senderUsername, accept });
    }

    socket.on('update-channels', (updatedChannels) => {
      channels = updatedChannels;
      renderChannels();
    });

    socket.on('channel-deleted', ({ channelName }) => {
      if (currentTarget.toLowerCase() === channelName.toLowerCase() && targetType === 'channel') {
        switchTarget('general', 'channel');
      }
    });

    socket.on('update-friends-list', (updatedFriends) => {
      friends = updatedFriends;
      renderFriendsList();
    });

    socket.on('update-friend-requests', (requests) => {
      pendingRequests = requests;
      renderRequestsList();
    });

    socket.on('update-online-users', (userList) => {
      onlineUsers.clear();
      userList.forEach(u => onlineUsers.set(u.username.toLowerCase(), u.avatarUrl));
      renderFriendsList();
    });

    function renderChannels() {
      const container = document.getElementById('channelList');
      container.innerHTML = '';
      channels.forEach(ch => {
        const div = document.createElement('div');
        const isActive = targetType === 'channel' && currentTarget.toLowerCase() === ch.toLowerCase();
        div.className = `channel ${isActive ? 'active' : ''}`;
        div.onclick = () => switchTarget(ch, 'channel');
        
        let deleteBtnHtml = '';
        if (isAdmin && ch !== 'general') {
          deleteBtnHtml = `<span class="delete-ch-btn" onclick="deleteChannel('${escapeHtml(ch)}', event)" title="Delete Channel">🗑️</span>`;
        }

        div.innerHTML = `<span># ${escapeHtml(ch)}</span>${deleteBtnHtml}`;
        container.appendChild(div);
      });
    }

    function renderFriendsList() {
      const list = document.getElementById('friendsList');
      list.innerHTML = '';

      if (friends.length === 0) {
        list.innerHTML = '<span style="font-size:0.75em; color:#949ba4;">No friends added yet.</span>';
        return;
      }

      friends.forEach(f => {
        const isOnline = onlineUsers.has(f.toLowerCase());
        const avatarSrc = onlineUsers.get(f.toLowerCase()) || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + encodeURIComponent(f);
        
        const item = document.createElement('div');
        const isSelected = targetType === 'dm' && currentTarget.toLowerCase() === f.toLowerCase();
        item.className = `friend-item ${isSelected ? 'active' : ''}`;
        item.onclick = () => switchTarget(f, 'dm');

        item.innerHTML = `
          <div class="friend-info">
            <img class="avatar" src="${escapeHtml(avatarSrc)}">
            <span>${escapeHtml(f)}</span>
          </div>
          <span class="status-dot ${isOnline ? 'online' : ''}"></span>
        `;
        list.appendChild(item);
      });
    }

    function renderRequestsList() {
      const container = document.getElementById('requestsList');
      const header = document.getElementById('requestsHeader');
      container.innerHTML = '';

      if (pendingRequests.length === 0) {
        header.style.display = 'none';
        return;
      }

      header.style.display = 'flex';
      pendingRequests.forEach(sender => {
        const div = document.createElement('div');
        div.className = 'request-card';
        div.innerHTML = `
          <span>${escapeHtml(sender)}</span>
          <div class="req-actions">
            <button class="accept-btn" onclick="respondRequest('${escapeHtml(sender)}', true)">✓</button>
            <button class="decline-btn" onclick="respondRequest('${escapeHtml(sender)}', false)">✕</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function switchTarget(target, type) {
      currentTarget = target;
      targetType = type;

      renderChannels();
      renderFriendsList();

      document.getElementById('chatTitle').innerText = type === 'channel' ? `# ${target}` : `@ ${target}`;
      document.getElementById('messages').innerHTML = '';

      socket.emit('join-room', { target, type });
    }

    socket.on('load-history', (messages) => {
      const container = document.getElementById('messages');
      container.innerHTML = '';
      messages.forEach(appendMessage);
    });

    socket.on('receive-message', (msg) => {
      appendMessage(msg);
    });

    socket.on('update-message-reactions', ({ messageId, reactions }) => {
      const msgElem = document.querySelector(`[data-msg-id="${messageId}"]`);
      if (!msgElem) return;

      const reactionsBar = msgElem.querySelector('.reactions-bar');
      reactionsBar.innerHTML = '';

      Object.entries(reactions).forEach(([emoji, userList]) => {
        if (userList.length === 0) return;
        const isUserReacted = userList.includes(username);
        const badge = document.createElement('div');
        badge.className = `reaction-badge ${isUserReacted ? 'active' : ''}`;
        badge.onclick = () => toggleReaction(messageId, emoji);
        badge.innerText = `${emoji} ${userList.length}`;
        reactionsBar.appendChild(badge);
      });
    });

    function toggleReaction(messageId, emoji) {
      socket.emit('toggle-reaction', { messageId, emoji });
    }

    function appendMessage(msg) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg';
      div.setAttribute('data-msg-id', msg.id);

      const reactionsHtml = buildReactionsHtml(msg.id, msg.reactions || {});

      div.innerHTML = `
        <img class="msg-avatar" src="${escapeHtml(msg.avatarUrl)}">
        <div class="msg-content">
          <div class="author">
            ${escapeHtml(msg.username)}
            <span class="time">${msg.time}</span>
          </div>
          <div class="text">${escapeHtml(msg.text)}</div>
          <div class="reactions-bar">${reactionsHtml}</div>
        </div>
        <div class="reaction-picker-trigger">
          ${AVAILABLE_EMOJIS.map(e => `<span class="emoji-opt" onclick="toggleReaction('${msg.id}', '${e}')">${e}</span>`).join('')}
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function buildReactionsHtml(msgId, reactions) {
      return Object.entries(reactions)
        .filter(([_, list]) => list.length > 0)
        .map(([emoji, list]) => {
          const isUserReacted = list.includes(username);
          return `<div class="reaction-badge ${isUserReacted ? 'active' : ''}" onclick="toggleReaction('${msgId}', '${emoji}')">${emoji} ${list.length}</div>`;
        }).join('');
    }

    function send() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      socket.emit('send-message', {
        target: currentTarget,
        type: targetType,
        username,
        text
      });

      socket.emit('typing', { target: currentTarget, type: targetType, isTyping: false });
      input.value = '';
    }

    function handleTyping() {
      socket.emit('typing', { target: currentTarget, type: targetType, isTyping: true });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        socket.emit('typing', { target: currentTarget, type: targetType, isTyping: false });
      }, 2000);
    }

    socket.on('user-typing', ({ username: typingUser, isTyping }) => {
      const container = document.getElementById('typingContainer');
      container.innerText = isTyping ? `${typingUser} is typing...` : '';
    });

    function escapeHtml(t) { 
      return (t || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); 
    }
  </script>
</body>
</html>
