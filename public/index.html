<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chromebook Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; height: 100vh; background: #313338; color: #dbdee1; overflow: hidden; }
    
    /* Sidebar */
    #sidebar { width: 240px; background: #2b2d31; padding: 15px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #1e1f22; }
    #sidebar h3 { color: #949ba4; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
    .channel { padding: 8px 12px; background: #35373c; border-radius: 4px; cursor: pointer; color: #949ba4; font-weight: 500; }
    .channel.active, .channel:hover { background: #404249; color: #ffffff; }
    
    /* Main Chat Area */
    #main { flex: 1; display: flex; flex-direction: column; background: #313338; }
    #chat-header { height: 48px; padding: 0 20px; display: flex; align-items: center; background: #313338; border-bottom: 1px solid #1e1f22; font-weight: bold; }
    #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    
    /* Message Bubble */
    .msg { background: #2b2d31; padding: 10px 14px; border-radius: 8px; width: fit-content; max-width: 80%; word-break: break-word; }
    .msg .author { font-weight: bold; font-size: 0.85em; color: #5865f2; margin-bottom: 4px; }
    .msg .time { font-size: 0.7em; color: #949ba4; font-weight: normal; margin-left: 8px; }
    .msg .text { font-size: 0.95em; color: #dbdee1; line-height: 1.4; }
    
    /* Input Area */
    #input-area { padding: 15px 20px; background: #313338; display: flex; gap: 10px; }
    input { flex: 1; padding: 12px 16px; background: #383a40; border: none; color: white; border-radius: 8px; font-size: 0.95em; outline: none; }
    input::placeholder { color: #80848e; }
    button { padding: 12px 20px; background: #5865f2; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #4752c4; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h3>Text Channels</h3>
    <div class="channel active" onclick="switchChannel('general')"># general</div>
  </div>

  <div id="main">
    <div id="chat-header"># general</div>
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="msgInput" placeholder="Message #general" onkeypress="if(event.key==='Enter') send()">
      <button onclick="send()">Send</button>
    </div>
  </div>

  <!-- Load Socket.io library directly from server -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentChannel = 'general';
    
    // Assign a random username on join
    const username = "User_" + Math.floor(1000 + Math.random() * 9000);

    socket.emit('join-channel', currentChannel);

    socket.on('channel-history', (history) => {
      const container = document.getElementById('messages');
      container.innerHTML = '';
      history.forEach(appendMessage);
    });

    socket.on('receive-message', (msg) => {
      appendMessage(msg);
    });

    function appendMessage(msg) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `
        <div class="author">${escapeHtml(msg.username)} <span class="time">${msg.timestamp}</span></div>
        <div class="text">${escapeHtml(msg.text)}</div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function send() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      socket.emit('send-message', { channel: currentChannel, username, text });
      input.value = '';
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
